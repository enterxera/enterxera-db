name: Sync EnterXera DB Matrix

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Full Parallel Sync
        env:
          ENRICH_LIMIT: 5000
          CONCURRENCY: 50
        run: npm run sync

      - name: Commit & Push changes
        run: |
          git config user.name "enterxera-bot"
          git config user.email "bot@enterxera.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(db): bulk matrix sync anime metadata"
            git pull --rebase origin main
            git push origin main
          fi
